name: iOS build

on: [push]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip influencer-duo-v10.zip
      - name: Build
        run: xcodebuild -project InfluenceStarDuo.xcodeproj -scheme InfluenceStarDuo -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build
